# Local SQS for development and tests.
#   docker compose up -d
#   dlq --local list
#   DLQ_TEST_SQS_ENDPOINT=http://localhost:4566 cargo nextest run --release
services:
  sqs:
    container_name: dlq-sqs
    image: softwaremill/elasticmq-native:1.7.1 # SQS-compatible, no license or auth token needed
    ports:
      - "4566:9324" # keep the 4566 port that `dlq --local` defaults to
    volumes:
      - ./.config/elasticmq.conf:/opt/elasticmq.conf:ro
