# Nextest configuration for dlq
# Documentation: https://nexte.st/book/configuration.html
#
# Every test runs in its own process and in parallel. SQS tests are isolated by
# unique queue names, so they need no serialization.

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"
success-output = "never"

# Property tests run several cases against a real SQS server.
[[profile.default.overrides]]
filter = 'test(prop_)'
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
# Report every failure rather than stopping at the first.
fail-fast = false

