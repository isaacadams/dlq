[package]
name = "dlq-core"
version = "2.0.0"
description = "easily poll messages from your AWS DLQ instance"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dlq"
path = "src/lib.rs"

[features]
# Shared SQS test fixtures (ElasticMQ via testcontainers). Not part of the public API.
test-utils = ["dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
tokio.workspace = true
aws-config.workspace = true
aws-sdk-sqs.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
uuid.workspace = true
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
# Enables `test-utils` for this crate's own unit and integration tests.
dlq-core = { path = ".", features = ["test-utils"] }
proptest = "1.12"
