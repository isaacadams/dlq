name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # One job so lint, build, and tests share a single compile and cache.
  ci:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # SQS tests start their own ElasticMQ containers via testcontainers (Docker is
      # preinstalled on ubuntu-latest). Pre-pull so the pull isn't charged to a test.
      - name: Pull ElasticMQ image
        run: docker pull softwaremill/elasticmq-native:1.7.1

      - name: Tests
        run: cargo nextest run --workspace --all-targets --profile ci

      - name: Doctests
        run: cargo test --workspace --doc
