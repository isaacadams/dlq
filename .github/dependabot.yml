version: 2
updates:
  # Weekly, grouped so routine bumps land as one PR per ecosystem.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["aws-*"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
