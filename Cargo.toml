[workspace]
members = [ "crates/*" ]
resolver = "3"

[workspace.package]
rust-version = "1.94.1" # minimum required by the AWS SDK crates
authors = ["Isaac Adams"]
edition = "2024"
license = "MIT"
repository = "https://github.com/isaacadams/dlq"

[workspace.dependencies]
anyhow = "1.0"
# Default features are off to avoid the legacy hyper 0.14 / rustls 0.21 client
# (unpatched advisories); `default-https-client` is the maintained hyper 1 stack.
aws-config = { version = "1.5", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "credentials-login", # credentials from `aws login`
    "sso",
] }
aws-sdk-sqs = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "parking_lot"] }
uuid = { version = "1.18", features = ["v4"] }
# Test support (ElasticMQ provides a lightweight, license-free SQS emulator)
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["elasticmq"] }

# Prefer release-mode artifacts to keep disk usage down.
# Scripts, aliases, and rust-analyzer are wired to --release; these
# profile settings make accidental debug/test builds much smaller too.

[profile.dev]
# No DWARF debug info / incremental caches (the main disk hogs).
debug = false
incremental = false
strip = "debuginfo"

[profile.test]
debug = false
incremental = false
strip = "debuginfo"

[profile.release]
incremental = false
strip = true
